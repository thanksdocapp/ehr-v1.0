name: Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  phpunit:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: ehr_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_TEST_HOST: 127.0.0.1
      DB_TEST_PORT: 3306
      DB_TEST_DATABASE: ehr_testing
      DB_TEST_USERNAME: root
      DB_TEST_PASSWORD: password

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom, curl, libxml, mbstring, zip, pdo, mysql, bcmath
          coverage: none

      - name: Install Composer dependencies
        run: |
          for attempt in 1 2 3; do
            composer install --no-interaction --prefer-dist --no-progress && exit 0
            echo "composer install failed (attempt ${attempt}/3), retrying..."
            sleep 10
          done
          exit 1

      - name: Run tests
        run: php artisan test
